- name: Install Nginx and deploy status page
  hosts: ec2
  become: true
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true
    - name: Deploy custom status page
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Set 4 - Server Status: UP</h1><p>Deployed by Ansible via Jenkins</p>"
    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true
